name: Publish device test package

on:
  workflow_dispatch:
    inputs:
      artifact_revision:
        description: Full 40-character commit containing public release parts and RELEASE_INPUTS.json
        required: true
        type: string
      release_tag:
        description: Existing matching draft release tag to publish as a prerelease
        required: true
        type: string

env:
  GH_REPO: ${{ github.repository }}

permissions:
  contents: write

concurrency:
  group: device-test-package-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch, verify and assemble pinned public release inputs
        env:
          ARTIFACT_REVISION: ${{ inputs.artifact_revision }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, urllib.request, zipfile

          revision = os.environ['ARTIFACT_REVISION']
          requested_tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'[0-9a-fA-F]{40}', revision):
              raise SystemExit('artifact_revision must be a full 40-character commit SHA')
          if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]{0,99}', requested_tag):
              raise SystemExit('release_tag has invalid characters')
          revision = revision.lower()
          base = f'https://raw.githubusercontent.com/a1c7e0/switchcraft/{revision}'
          def fetch(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'switchcraft-device-package-publisher'})
              with urllib.request.urlopen(req, timeout=120) as response:
                  return response.read()
          def digest(data): return hashlib.sha256(data).hexdigest()
          record_bytes = fetch(base + '/RELEASE_INPUTS.json')
          record = json.loads(record_bytes)
          if record.get('release_tag') != requested_tag:
              raise SystemExit('requested release tag does not match pinned RELEASE_INPUTS.json')
          filename = record['filename']
          if pathlib.PurePosixPath(filename).name != filename or not filename.endswith('.zip'):
              raise SystemExit('invalid package filename in release inputs')
          parts = record['parts']
          if not parts or any(pathlib.PurePosixPath(p['name']).name != p['name'] for p in parts):
              raise SystemExit('invalid package part list')
          assembled = bytearray()
          for part in parts:
              data = fetch(base + '/' + part['name'])
              if digest(data) != part['sha256']:
                  raise SystemExit(f"part hash mismatch: {part['name']}")
              assembled.extend(data)
          if len(assembled) != record['bytes'] or digest(assembled) != record['sha256']:
              raise SystemExit('assembled package size or SHA-256 mismatch')
          package = bytes(assembled)
          with zipfile.ZipFile(__import__('io').BytesIO(package)) as z:
              names = set(z.namelist())
              required = {
                  'switch/switch-diagnostics/switch-diagnostics.nro',
                  'switch/java-test/java-test.nro',
                  'switch/ffi-test/ffi-test.nro',
                  'switch/zero-services-test/zero-services-test.nro',
                  'switch/vulkan-test/vulkan-test.nro',
                  'switch/vulkan-present/vulkan-present.nro',
                  'switch/java25-test/java25-test.nro',
                  'switch/switchcraft-java25/switchcraft-java25.nro',
                  'switch/minecraft-launcher/minecraft-launcher.nro',
                  'switch/mc-runtime/tests/java25-hello.jar',
                  'switch/mc-runtime/tests/java25-tests.jar',
                  'switch/mc-runtime/tests/diagnostic-tests.jar',
                  'switch/mc-runtime/tests/dependency.jar',
                  'switch/mc-runtime/tests/java25-agent-smoke-agent.jar',
                  'switch/mc-runtime/tests/java25-agent-smoke-app.jar',
                  'switch/mc-runtime/tests/switchcraft-native-smoke.jar',
                  'switch/mc-runtime/launchers/switchcraft-launcher-bridge.jar',
                  'switch/mc-runtime/launchers/switchcraft-lwjgl-horizon.jar',
                  'switch/mc-runtime/runtimes/minijvm/minijvm_rt.jar',
                  'switch/mc-runtime/runtimes/openjdk25/lib/modules',
                  'START_HERE.md',
              }
              missing = sorted(required - names)
              if missing:
                  raise SystemExit('package missing required members: ' + ', '.join(missing))
          manifest = fetch(base + '/' + record['manifest']['name'])
          sums = fetch(base + '/' + record['sha256sums']['name'])
          if digest(manifest) != record['manifest']['sha256']:
              raise SystemExit('manifest SHA-256 mismatch')
          if digest(sums) != record['sha256sums']['sha256']:
              raise SystemExit('SHA256SUMS SHA-256 mismatch')
          manifest_obj = json.loads(manifest)
          if any(manifest_obj.get(key) not in (None, requested_tag) for key in ('release_tag','package_id')):
              raise SystemExit('package manifest identifies a different release')
          with zipfile.ZipFile(__import__('io').BytesIO(package)) as z:
              if z.testzip() is not None: raise SystemExit('ZIP CRC check failed')
              names = set(z.namelist())
              nro_paths = sorted(n for n in names if n.endswith('.nro'))
              if len(nro_paths) != 9:
                  raise SystemExit(f'expected exactly nine NROs, found {len(nro_paths)}')
              jars = [n for n in names if n.startswith('switch/mc-runtime/') and n.endswith('.jar')]
              if len(jars) != 10:
                  raise SystemExit(f'expected exactly ten runtime/test JARs, found {len(jars)}')
              if not any(n.startswith('switch/mc-runtime/runtimes/openjdk25/') and n.endswith('/modules') for n in names):
                  raise SystemExit('package lacks the genuine Java 25 runtime image')
              runtime_files = manifest_obj.get('runtime_image_files', [])
              missing_runtime = [item.get('path') for item in runtime_files if item.get('path') not in names]
              if missing_runtime:
                  raise SystemExit('manifest runtime image members missing from ZIP: ' + ', '.join(missing_runtime[:10]))
              for item in runtime_files:
                  if digest(z.read(item['path'])) != item['sha256']:
                      raise SystemExit('runtime image member hash mismatch: ' + item['path'])
          out = pathlib.Path('verified-release')
          out.mkdir()
          for name, data in ((filename, package), (record['manifest']['name'], manifest),
                             (record['sha256sums']['name'], sums)):
              if pathlib.PurePosixPath(name).name != name:
                  raise SystemExit('release asset filename must be a basename')
              (out / name).write_bytes(data)
          note_lines = [f"Verified complete Switchcraft device test package `{filename}`.",
                        f"SHA-256: `{record['sha256']}` ({record['bytes']} bytes).",
                        'This ZIP is ready to extract directly onto the SD root. Use application-mode hbmenu and the included START_HERE.md. Java25 attempts require a fresh process.',
                        'R2 fixes are cross-built and host-tested; physical execution of the new fixes remains NOT TESTED. The historical B7 native/graphics successes do not establish Java25, JNI/FFM, instrumentation or Minecraft execution.',
                        'Runtime feedback: https://github.com/a1c7e0/java-switch/issues/4 , https://github.com/a1c7e0/java-switch/issues/5 , https://github.com/a1c7e0/java-switch/issues/6 .']
          for key, label in (('source_revision', 'Switchcraft source revision'),
                             ('java_switch_revision', 'java-switch runtime revision')):
              if record.get(key):
                  note_lines.append(f"{label}: `{record[key]}`.")
          pathlib.Path('release-notes.md').write_text('\n\n'.join(note_lines) + '\n')
          print(f"Verified {filename}: {len(package)} bytes, SHA-256 {digest(package)}")
          PY

      - name: Require the matching draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release view "$RELEASE_TAG" --json tagName,isDraft > /tmp/release.json
          python3 - <<'PY'
          import json, os
          release=json.load(open('/tmp/release.json'))
          if release.get('tagName') != os.environ['RELEASE_TAG'] or release.get('isDraft') is not True:
              raise SystemExit('target must be the matching draft release')
          PY

      - name: Upload verified assets and publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release upload "$RELEASE_TAG" verified-release/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --notes-file release-notes.md
